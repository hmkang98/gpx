<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한라산 GPX + 속도 계기판</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { font-family: 'Malgun Gothic'; margin:20px; background:#f4f4f4; }
#map { height:500px; border-radius:12px; }

.controls { margin-top:10px; }
button { padding:8px 15px; margin-right:5px; }

.info-panel { margin-top:10px; display:flex; gap:15px; }

/* 속도 계기판 */
.speedometer {
    margin-top:15px;
    width:220px;
    height:140px;
    background:#111;
    color:#0f0;
    border-radius:12px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    box-shadow: inset 0 0 10px rgba(0,255,0,0.5);
    font-family: monospace;
}
.speed-value {
    font-size:36px;
    font-weight:bold;
}
</style>
</head>

<body>

<h2>📍 한라산 GPX + 속도 계기판</h2>

<div id="map"></div>

<div class="controls">
    <button onclick="startAnimation()">▶ 시작</button>
    <button onclick="pauseAnimation()">⏸ 정지</button>
    <button onclick="resetMarker()">🔄 리셋</button>
</div>

<div class="speedometer">
    <div>현재 속도</div>
    <div class="speed-value"><span id="speed">0</span> km/h</div>
</div>

<div class="info-panel">
    <div>거리: <span id="distance">0</span> km</div>
    <div>최고고도: <span id="elevation">0</span> m</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

<script>
// MovingMarker
L.MovingMarker = L.Marker.extend({
initialize:function(i,t,e){
L.Marker.prototype.initialize.call(this,i[0],e);
this._latlngs=i.map(i=>L.latLng(i));
this._durations=t;
this._currentIndex=0;
this._state=0;
},
start:function(){
this._state=1;
this._animate();
},
pause:function(){
this._state=2;
},
_animate:function(){
if(this._state!==1) return;

let i=this._currentIndex;
if(i>=this._latlngs.length-1) return;

let start=this._latlngs[i];
let end=this._latlngs[i+1];

this.setLatLng(end);
this._currentIndex++;

this.fire("progress");

setTimeout(()=>this._animate(),30);
}
});
L.movingMarker = (i,t,e)=> new L.MovingMarker(i,t,e);

// 지도
const map = L.map('map').setView([33.36,126.52],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let movingMarker;
let routeCoords=[];

// 속도 계산 변수
let lastLatLng=null;
let lastTime=null;

// 거리 계산
function getDistance(a,b){
const R=6371000;
const toRad=x=>x*Math.PI/180;

const dLat=toRad(b.lat-a.lat);
const dLng=toRad(b.lng-a.lng);

const v=Math.sin(dLat/2)**2 +
Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*
Math.sin(dLng/2)**2;

return R*2*Math.atan2(Math.sqrt(v),Math.sqrt(1-v));
}

// GPX 로드
new L.GPX("Hanllasan_20190605.gpx", {
async:true,
marker_options:{startIconUrl:null,endIconUrl:null}
})
.on('loaded', e=>{
const gpx=e.target;

map.fitBounds(gpx.getBounds());

document.getElementById('distance').innerText =
(gpx.get_distance()/1000).toFixed(2);

document.getElementById('elevation').innerText =
gpx.get_elevation_max().toFixed(0);

// 좌표 추출
gpx.eachLayer(layer=>{
if(layer instanceof L.Polyline){
routeCoords = routeCoords.concat(layer.getLatLngs());
}
});

routeCoords = routeCoords.flat();

createMarker();
})
.addTo(map);

// 마커 생성
function createMarker(){
if(movingMarker) map.removeLayer(movingMarker);

movingMarker = L.movingMarker(routeCoords,30000);

movingMarker.on('progress',()=>{
const current = movingMarker.getLatLng();
const now = performance.now();

if(lastLatLng && lastTime){
const dist = getDistance(lastLatLng,current);
const time = (now-lastTime)/1000;

const speed = (dist/time)*3.6;
document.getElementById('speed').innerText = speed.toFixed(1);
}

lastLatLng = current;
lastTime = now;

map.panTo(current);
});

movingMarker.addTo(map);
}

// 컨트롤
function startAnimation(){
movingMarker.start();
}
function pauseAnimation(){
movingMarker.pause();
}
function resetMarker(){
lastLatLng=null;
lastTime=null;
document.getElementById('speed').innerText="0";
createMarker();
}
</script>

</body>
</html>
